quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:supplies_infra;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

quarkus.rest-client.registry-api.url=http://localhost:18081
quarkus.rest-client.registry-api.connect-timeout=2000
quarkus.rest-client.registry-api.read-timeout=2000

quarkus.log.level=WARN
quarkus.log.console.json=false
