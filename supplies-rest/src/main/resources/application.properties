# Mekano Supplies - configuracao principal
quarkus.application.name=mekano-supplies
quarkus.rest.path=/api/v4
quarkus.http.port=8082
quarkus.banner.enabled=false

# Indexacao CDI dos modulos internos (beans Panache, services e adapters)
quarkus.index-dependency.supplies-application.group-id=com.fiap.mekano.supplies
quarkus.index-dependency.supplies-application.artifact-id=supplies-application
quarkus.index-dependency.supplies-infrastructure.group-id=com.fiap.mekano.supplies
quarkus.index-dependency.supplies-infrastructure.artifact-id=supplies-infrastructure

# Datasource PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${SUPPLIES_DB_HOST:localhost}:${SUPPLIES_DB_PORT:5434}/${SUPPLIES_DB_NAME:mekano_supplies}
quarkus.datasource.username=${SUPPLIES_DB_USER:mekano}
quarkus.datasource.password=${SUPPLIES_DB_PASSWORD:mekano}
quarkus.datasource.metrics.enabled=true

# Hibernate / Flyway
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Registry
registry.base-url=${REGISTRY_URL:http://localhost:8081}
registry.timeout-ms=${REGISTRY_TIMEOUT_MS:3000}
quarkus.rest-client.registry-api.url=${registry.base-url}
quarkus.rest-client.registry-api.connect-timeout=${registry.timeout-ms}
quarkus.rest-client.registry-api.read-timeout=${registry.timeout-ms}

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=Mekano Supplies Purchase Request Service API
quarkus.smallrye-openapi.info-version=4.0.0
quarkus.smallrye-openapi.info-description=Estoque, requisicao de compra e NF de entrada - Fase 4
quarkus.swagger-ui.always-include=true

# Health / Metrics
quarkus.micrometer.export.prometheus.enabled=true

# Logs
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false
%prod.quarkus.log.console.json.mdc.enabled=true

# Testes: H2 em memoria, sem Docker/DevServices
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:supplies_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.rest-client.registry-api.url=http://localhost:18081
%test.quarkus.log.level=WARN
%test.quarkus.log.console.json=false
